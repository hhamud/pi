name: Publish @earendil-works/pi-ai (fork build)

# Triggered on push to main when packages/ai/** or the opencode snapshot
# changed. Bumps the patch version in packages/ai/package.json, rebuilds
# the package, and uploads a tarball to a GitHub Release.
#
# Why a GitHub Release (not npm publish):
# The fork keeps the package name @earendil-works/pi-ai to avoid invasive
# renames across the 270+ files in the monorepo that import it. Publishing
# that name to npm would collide with the upstream package, which the
# user does not own. A GitHub Release is the next-best auto-distribution
# channel: the user installs via a stable release URL, and the workflow
# is fully automated end-to-end.
#
# Install (after first release):
#   bun add -g https://github.com/hhamud/pi/releases/download/<tag>/earendil-works-pi-ai-<version>.tgz
#   npm install -g https://github.com/hhamud/pi/releases/download/<tag>/earendil-works-pi-ai-<version>.tgz

on:
  push:
    branches: [main]
    paths:
      - "packages/ai/**"
      - "packages/ai/src/providers/opencode-snapshot.json"
      - ".github/workflows/publish-pi-ai.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pi-ai
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read current version
        id: version
        run: |
          current=$(node -p "require('./packages/ai/package.json').version")
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          node -e '
            const fs = require("fs");
            const path = "packages/ai/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const parts = pkg.version.split(".").map(n => parseInt(n, 10));
            parts[2] = (parts[2] || 0) + 1;
            pkg.version = parts.join(".");
            fs.writeFileSync(path, JSON.stringify(pkg, null, "\t") + "\n");
            console.log("Bumped to " + pkg.version);
          '
          new_version=$(node -p "require('./packages/ai/package.json').version")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/package.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(ai): bump version to ${{ steps.bump.outputs.new_version }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Build @earendil-works/pi-ai
        # Runs generate-models (refreshing from models.dev) + build:offline,
        # which bakes the opencode-snapshot.json-derived data into dist/.
        run: npm --prefix packages/ai run build

      - name: Pack tarball
        working-directory: packages/ai
        run: |
          npm pack
          mv earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}.tgz \
             /tmp/earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}.tgz

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}
          path: /tmp/earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: |
            Auto-built snapshot of `@earendil-works/pi-ai` from
            [hhamud/pi](https://github.com/hhamud/pi).

            Contains the regenerated OpenCode model catalog from
            [models.dev](https://models.dev), baked into the
            `dist/providers/data/` directory at build time.

            Install:
            ```
            bun add -g https://github.com/hhamud/pi/releases/download/${{ steps.bump.outputs.tag }}/earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}.tgz
            ```
          files: /tmp/earendil-works-pi-ai-${{ steps.bump.outputs.new_version }}.tgz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
