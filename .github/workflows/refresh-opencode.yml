name: Refresh OpenCode Model Catalog

# Daily cron that regenerates the opencode/opencode-go model catalog from
# models.dev and writes a tracked snapshot. If the snapshot changed, the
# workflow commits the change directly to main; the push then triggers
# .github/workflows/publish-pi-ai.yml which bumps the version and
# publishes a new @hhamud/pi-ai to npm.
#
# We commit to main rather than opening a PR because GitHub disables
# PR creation from GITHUB_TOKEN by default on personal repos (the toggle
# "Allow GitHub Actions to create and approve pull requests" lives in the
# repo's Settings → Actions → General and is intentionally not exposed in
# any public REST or GraphQL API). Direct commit keeps the pipeline
# fully automated; the diff is still reviewable on the resulting commit.
# To switch to a PR-based flow, enable that UI toggle in the repo
# settings and restore the peter-evans/create-pull-request step.

on:
  # 6am UTC daily.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize refresh runs so two daily triggers don't race to commit.
  group: refresh-opencode
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist the GITHUB_TOKEN so the final commit step can push.
          persist-credentials: true
          # Full history so `git diff` against HEAD works.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system deps
        # generate-models doesn't strictly need Cairo, but matching ci.yml
        # means we can add a verify job in the future without surprises.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate model catalog from models.dev
        run: npm --prefix packages/ai run generate-models

      - name: Write tracked snapshot
        # Reads src/providers/data/opencode{,-go}.json (the gitignored
        # output of the previous step) and writes the diff-friendly,
        # committed packages/ai/src/providers/opencode-snapshot.json.
        run: node packages/ai/scripts/snapshot-opencode.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- packages/ai/src/providers/opencode-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes since last refresh."
          else
            changed_count=$(git diff --numstat -- packages/ai/src/providers/opencode-snapshot.json | awk '{s+=$1+$2} END {print s}')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "lines_changed=$changed_count" >> "$GITHUB_OUTPUT"
            echo "Catalog changed ($changed_count lines). Committing to main."
          fi

      - name: Validate snapshot JSON
        if: steps.diff.outputs.changed == 'true'
        run: node -e "JSON.parse(require('fs').readFileSync('packages/ai/src/providers/opencode-snapshot.json','utf8')); console.log('snapshot JSON parses OK')"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever the publish workflow may have pushed in
          # the gap between this run's checkout and now. Without this,
          # a 06:00 UTC schedule run races against the publish workflow's
          # version-bump commit and fails with '[rejected] HEAD -> main
          # (fetch first)'.
          git fetch origin main
          git rebase origin/main
          git add packages/ai/src/providers/opencode-snapshot.json
          git commit -m "chore(ai): refresh opencode model catalog" \
            -m "Trigger: ${{ github.event_name }} (${{ github.ref }})" \
            -m "Snapshot diff: ${{ steps.diff.outputs.lines_changed }} lines changed" \
            || echo "No changes after rebase; nothing to commit."
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
