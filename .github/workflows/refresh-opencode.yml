name: Refresh OpenCode Model Catalog

# Daily cron that regenerates the opencode/opencode-go model catalog from
# models.dev, writes a tracked snapshot, and opens a PR if anything changed.
# Merging the PR triggers .github/workflows/publish-pi-ai.yml which bumps
# the version and publishes a new @hhamud/pi-ai to npm.

on:
  # 6am UTC daily.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-opencode
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Regenerate model catalog from models.dev
        run: cd packages/ai && bun run generate-models

      - name: Write tracked snapshot
        # Reads src/providers/data/opencode{,-go}.json (the gitignored
        # output of the previous step) and writes the diff-friendly,
        # committed packages/ai/src/providers/opencode-snapshot.json.
        run: node packages/ai/scripts/snapshot-opencode.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- packages/ai/src/providers/opencode-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes since last refresh."
          else
            changed_count=$(git diff --numstat -- packages/ai/src/providers/opencode-snapshot.json | awk '{s+=$1+$2} END {print s}')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "lines_changed=$changed_count" >> "$GITHUB_OUTPUT"
            echo "Catalog changed ($changed_count lines). Opening PR."
          fi

      - name: Validate snapshot JSON
        if: steps.diff.outputs.changed == 'true'
        run: node -e "JSON.parse(require('fs').readFileSync('packages/ai/src/providers/opencode-snapshot.json','utf8')); console.log('snapshot JSON parses OK')"

      - name: Disable husky hooks for the bot commit
        # The husky pre-commit hook runs 'npm run check' (biome + lint +
        # typecheck + shrinkwrap). For an automated catalog refresh that
        # only touches the opencode-snapshot.json, the full check is
        # disproportionate and trips on unrelated version-drift checks
        # the fork hasn't reconciled. Disable the hook so peter-evans@v6
        # can commit cleanly.
        if: steps.diff.outputs.changed == 'true'
        run: git config --local core.hooksPath /dev/null

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(ai): refresh opencode model catalog"
          title: "chore(ai): refresh opencode model catalog"
          body: |
            Automated refresh of the OpenCode model catalog from
            [models.dev](https://models.dev).

            - Trigger: ${{ github.event_name }} (${{ github.ref }})
            - Snapshot diff: ${{ steps.diff.outputs.lines_changed }} lines changed
            - Generated at: see `generatedAt` in `opencode-snapshot.json`

            Merging this PR will trigger `.github/workflows/publish-pi-ai.yml`
            to bump the version and publish a new `@hhamud/pi-ai` to npm.
          branch: chore/refresh-opencode-models
          delete-branch: true
          signoff: true
